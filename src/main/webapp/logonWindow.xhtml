<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">
<h:head>
    <title>Biblioteka - Logowanie</title>
</h:head>
<h:body style="font-family: Arial, sans-serif; margin: 40px;">
    <h2>Logowanie do systemu Biblioteka (HTTPS)</h2>
    <h:form pt:method="post"
            pt:action="#{facesContext.externalContext.encodeActionURL('j_security_check')}">
        <table>
            <tr>
                <td>Użytkownik:</td>
                <td><h:inputText pt:name="j_username" id="j_username" value="" size="20"/></td>
            </tr>
            <tr>
                <td>Hasło:</td>
                <td><h:inputSecret pt:name="j_password" id="j_password" value="" size="20"/></td>
            </tr>
            <tr>
                <td colspan="2" style="padding-top: 10px;">
                    <input type="submit" value="Zaloguj"/>
                </td>
            </tr>
        </table>
    </h:form>
    <p style="color: gray; font-size: 12px;">
        Konta testowe z bazy BibliotekaAuth: <b>admin / admin</b> lub <b>czytelnik / czytelnik</b>
    </p>
</h:body>
</html>
